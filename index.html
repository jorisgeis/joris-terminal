    <script>
      // Apply a saved theme before first paint, so dark-mode visitors don't see a flash.
      try {
        var saved = localStorage.getItem('jg-theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    </script>
